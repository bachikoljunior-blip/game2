name: Fresh game verification
on:
  push:
    branches: [codex/game2-rebuild-20260913]
    paths: ['fresh/**', '.github/workflows/fresh-game.yml', 'docs/**', 'index.html', 'public/**', 'src/**', 'vite.config.js', 'vite.single.config.js', 'package.json', 'package-lock.json', 'tools/check-fresh-catalog.mjs', 'tools/validate-project-state.mjs', '.kit/**', 'ARCHITECTURE.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-game-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact revision and unchanged public root
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 1ded4aae27f8331cec10975c8dbac9eb482460a9 HEAD -- docs index.html public src vite.config.js vite.single.config.js package.json package-lock.json
      - name: Repository, catalog and ownership gates
        run: |
          node .kit/tools/bootstrap.mjs --target=. --check
          node tools/validate-project-state.mjs --selftest
          npm run validate:project
          node tools/check-fresh-catalog.mjs
          npm run check:ownership
          npm run build
          git diff --check
      - name: Install video and PCM integrity tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Fresh unit contracts
        run: node --test fresh/*.test.mjs
      - name: Fresh production build
        run: node node_modules/vite/bin/vite.js build --config fresh/vite.config.mjs
      - run: npx playwright install --with-deps chromium
      - name: Tested worktree is still the exact revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- .
          git diff --cached --exit-code HEAD -- .
      - name: Real browser inputs and WebGL recovery
        run: |
          node node_modules/vite/bin/vite.js preview --config fresh/vite.config.mjs --host 127.0.0.1 --port 4178 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          browser_status=0
          matrix_status=0
          node fresh/browser-smoke.mjs || browser_status=$?
          node fresh/route-matrix-smoke.mjs || matrix_status=$?
          if (( browser_status != 0 || matrix_status != 0 )); then
            exit 1
          fi
      - name: Decode continuous play evidence
        if: always()
        run: node fresh/verify-recordings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-game-${{ github.sha }}
          path: AI_DEVELOPMENT/EVIDENCE/fresh-20260913/
          if-no-files-found: error
          retention-days: 90
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Same-source build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node node_modules/vite/bin/vite.js build --config fresh/vite.config.mjs
          git diff --exit-code HEAD -- .
      - name: Unambiguous touch input and optional exploration circuits
        id: experience_routes
        run: |
          node node_modules/vite/bin/vite.js preview --config fresh/vite.config.mjs --host 127.0.0.1 --port 4178 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node fresh/experience-smoke.mjs
      - name: Preserve a failed exploration before the longer motion study
        if: failure() && steps.experience_routes.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-exploration-failure-${{ github.sha }}
          path: |
            AI_DEVELOPMENT/EVIDENCE/fresh-20260913/experience-report.json
            AI_DEVELOPMENT/EVIDENCE/fresh-20260913/explore-*.png
            AI_DEVELOPMENT/EVIDENCE/fresh-20260913/exploration-*.webm
          if-no-files-found: error
          retention-days: 90
      - name: Generate listening assets and capture actual game sound
        if: always()
        run: |
          node fresh/audio-audition.mjs
          node node_modules/vite/bin/vite.js preview --config fresh/vite.config.mjs --host 127.0.0.1 --port 4178 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node fresh/audio-browser-capture.mjs
      - name: Render every actor motion and environmental movement
        if: always()
        run: node fresh/motion-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-experience-${{ github.sha }}
          path: AI_DEVELOPMENT/EVIDENCE/fresh-20260913/
          if-no-files-found: error
          retention-days: 90
