name: Comparison material acquisition
on:
  push:
    branches: [codex/game2-rebuild-20260913]
    paths:
      - AI_DEVELOPMENT/COMPARISON_MEDIA/C04_ACQUISITION.json
      - AI_DEVELOPMENT/COMPARISON_MEDIA/acquire_c04.py
      - .github/workflows/comparison-material.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game2-comparison-material-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed comparison sources and media links
        run: python3 AI_DEVELOPMENT/COMPARISON_MEDIA/acquire_c04.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c04-reference-${{ github.sha }}
          path: AI_DEVELOPMENT/COMPARISON_MEDIA/acquired/
