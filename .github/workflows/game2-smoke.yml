name: Game2 native input and graphics recovery

on:
  push:
    branches: ['codex/game2-smoke-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tools/check-ui-r17.mjs
      - run: node --check tools/browser-smoke-capture.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tools/browser-smoke-capture.mjs
      - name: Preserve browser behavior and native pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game2-smoke-${{ github.sha }}
          path: shots/browser-smoke-r17*
          if-no-files-found: error
          retention-days: 14
