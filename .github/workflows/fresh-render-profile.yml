name: Fresh rendering diagnosis
on:
  push:
    branches: [codex/game2-rebuild-20260913]
    paths: ['fresh/**', 'tools/fresh-render-profile.mjs', '.github/workflows/fresh-render-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-render-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            revision: acf0f9ec86996245ad712d6adc72e5d6159f6711
          - label: candidate
            revision: current
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare the immutable comparison source
        env:
          PROFILE_REVISION: ${{ matrix.revision }}
        run: |
          if [ "$PROFILE_REVISION" = current ]; then PROFILE_REVISION="$GITHUB_SHA"; fi
          git worktree add --detach ../profile-runtime "$PROFILE_REVISION"
          ln -s "$GITHUB_WORKSPACE/node_modules" ../profile-runtime/node_modules
          test "$(git -C ../profile-runtime rev-parse HEAD)" = "$PROFILE_REVISION"
      - name: Measure ordinary rendering and explicitly separate diagnostic variants
        env:
          PROFILE_SOURCE_ROOT: ${{ github.workspace }}/../profile-runtime
          PROFILE_OUTPUT: ${{ github.workspace }}/AI_DEVELOPMENT/EVIDENCE/fresh-render-profile/${{ matrix.label }}
          PROFILE_VARIANTS: ${{ matrix.label == 'candidate' && 'full,no-leaf-shadows,no-leaves' || 'full' }}
        run: node tools/fresh-render-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-render-profile-${{ matrix.label }}-${{ github.sha }}
          path: AI_DEVELOPMENT/EVIDENCE/fresh-render-profile/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90
      - name: Read back the original bounded profile evidence
        if: always()
        env:
          PROFILE_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import os, pathlib, hashlib, json, io, zipfile, base64
          label=os.environ['PROFILE_LABEL']
          assert label in ('baseline','candidate')
          root=pathlib.Path('AI_DEVELOPMENT/EVIDENCE/fresh-render-profile')/label
          items=[]
          for name in ('report.json','full.png'):
              p=root/name
              if not p.exists(): continue
              assert not p.is_symlink() and p.is_file() and p.resolve().parent==root.resolve()
              b=p.read_bytes(); assert len(b)<=12000000
              items.append((name,b))
          assert items
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
              for name,b in items: z.writestr(name,b)
          b=buf.getvalue()
          print('MEDIA_ARCHIVE_BEGIN '+json.dumps({'version':'render-profile-'+label,'runnerRevision':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'files':[{'path':n,'bytes':len(v),'sha256':hashlib.sha256(v).hexdigest()} for n,v in items]}))
          encoded=base64.b64encode(b).decode()
          for i in range(0,len(encoded),6000): print('MEDIA_BYTES '+encoded[i:i+6000])
          print('MEDIA_ARCHIVE_END')
          PY
