name: iPhone SE 3 Mobile Safari gate

on:
  workflow_run:
    workflows: [iPhone SE 3 WebKit gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-safari-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  ios-safari:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the WebKit-verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Refuse a superseded or mismatched upstream revision
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact dependencies and build
        run: |
          npm ci
          npm run validate:project
          npm run build
      - name: Install pinned Appium and XCUITest driver
        run: |
          npm install --global appium@3.6.0
          appium driver install xcuitest@12.1.3
          appium driver list --installed
      - name: Select and boot iPhone SE 3 simulator
        id: simulator
        shell: bash
        run: |
          selection="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | .key as $runtime | .value[] |
             select(.name == "iPhone SE (3rd generation)" and .isAvailable == true) |
             {udid: .udid, runtime: $runtime}] |
            sort_by(.runtime) | last | [.udid, .runtime] | @tsv')"
          test -n "$selection" && test "$selection" != "null"
          IFS=$'\t' read -r udid runtime <<< "$selection"
          test -n "$udid" && test -n "$runtime"
          platform_version="$(printf '%s' "$runtime" | sed -E 's/^.*\.iOS-//; s/-/./g')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "platform_version=$platform_version" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: Start Appium and simulator video
        shell: bash
        run: |
          mkdir -p test-results/ios-safari
          appium --base-path / --log test-results/ios-safari/appium.log > /dev/null 2>&1 &
          echo $! > test-results/ios-safari/appium.pid
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" recordVideo --codec=h264 --force test-results/ios-safari/ios-safari.mp4 > test-results/ios-safari/video.log 2>&1 &
          echo $! > test-results/ios-safari/video.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise Mobile Safari through Appium
        env:
          IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          IOS_SIMULATOR_PLATFORM_VERSION: ${{ steps.simulator.outputs.platform_version }}
        run: npm run test:ios-safari
      - name: Stop recording
        if: always()
        shell: bash
        run: |
          if test -f test-results/ios-safari/video.pid; then kill -INT "$(cat test-results/ios-safari/video.pid)" 2>/dev/null || true; fi
          if test -f test-results/ios-safari/appium.pid; then kill "$(cat test-results/ios-safari/appium.pid)" 2>/dev/null || true; fi
          sleep 2
      - name: Preserve Safari screenshots, video, logs, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-mobile-safari-${{ github.event.workflow_run.head_sha || github.sha }}
          path: test-results/ios-safari
          if-no-files-found: warn
          retention-days: 14
