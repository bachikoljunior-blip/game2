<meta name="apple-mobile-web-app-capable" content="yes" />

<title>KAGEROU 陽炎</title>

<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05050a;
    font-family: ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- Boot / loading veil ---- */
  #boot {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2.2rem;
    background:
      radial-gradient(120% 90% at 50% 8%, #21151a 0%, #0b0709 45%, #050406 100%);
    transition: opacity .9s ease, visibility .9s;
  }
  #boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot-mark {
    font-size: clamp(3rem, 14vw, 7rem); font-weight: 200; letter-spacing: .32em;
    color: #f2e3cf; text-indent: .32em;
    text-shadow: 0 0 34px rgba(214,106,72,.45), 0 0 90px rgba(214,106,72,.18);
    animation: mark-in 2.4s cubic-bezier(.16,1,.3,1) both;
  }
  #boot-sub {
    font-size: clamp(.6rem, 2.4vw, .78rem); letter-spacing: .55em; text-indent: .55em;
    color: #8e7f72; text-transform: uppercase; animation: mark-in 2.4s .35s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes mark-in { from { opacity: 0; filter: blur(14px); transform: translateY(14px) } to { opacity: 1; filter: blur(0); transform: none } }
  #boot-bar { width: min(58vw, 320px); height: 1px; background: rgba(242,227,207,.14); overflow: hidden; }
  #boot-bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #d66a48, #f2e3cf); transition: width .35s ease; }
  #boot-status { font-size: .66rem; letter-spacing: .28em; color: #6c6058; text-transform: uppercase; min-height: 1em; }
  #boot-start {
    margin-top: .4rem; padding: .95rem 2.6rem; border: 1px solid rgba(242,227,207,.35);
    background: rgba(242,227,207,.04); color: #f2e3cf; font: inherit; font-size: .82rem;
    letter-spacing: .42em; text-indent: .42em; text-transform: uppercase; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .5s ease, background .25s, border-color .25s;
    backdrop-filter: blur(6px);
  }
  #boot-start.ready { opacity: 1; pointer-events: auto; animation: pulse 3.2s ease-in-out infinite; }
  #boot-start:active { background: rgba(214,106,72,.22); border-color: #d66a48; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,106,72,0) } 50% { box-shadow: 0 0 26px 0 rgba(214,106,72,.28) } }

  /* ---- Rotate hint (portrait phones) ---- */
  #rotate {
    position: fixed; inset: 0; z-index: 90; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.4rem; background: #05050a; color: #a5978a;
    font-size: .8rem; letter-spacing: .3em; text-align: center; padding: 2rem;
  }
  #rotate svg { width: 74px; height: 74px; stroke: #d66a48; fill: none; stroke-width: 1.5; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%,100% { transform: rotate(-14deg) } 50% { transform: rotate(76deg) } }
  @media (orientation: portrait) and (pointer: coarse) { body.needs-landscape #rotate { display: flex; } }

  #fatal { position: fixed; inset: 0; z-index: 200; display: none; padding: 2rem; color: #e8d9c8;
    background: #0b0508; font-size: .82rem; line-height: 1.7; overflow: auto; white-space: pre-wrap; }
</style>
  <script type="module" crossorigin src="./assets/index-B3Qct5lc.js"></script>
</head>
<body>
  <div id="app"><canvas id="game-canvas"></canvas></div>

  <div id="rotate">
    <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 19h6"/></svg>
    <div>端末を横向きにしてください<br><span style="opacity:.55">ROTATE YOUR DEVICE</span></div>
  </div>

  <div id="boot">
    <div id="boot-mark">陽炎</div>
    <div id="boot-sub">Kagerou</div>
    <div id="boot-bar"><i></i></div>
    <div id="boot-status">initialising</div>
    <button id="boot-start">Enter</button>
  </div>

  <div id="fatal"></div>

</body>
</html>
