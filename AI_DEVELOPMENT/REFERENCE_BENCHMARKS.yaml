 "purpose": "Per-element reference benchmarks for KAGEROU. This file is the authority for WHICH shipped title sets the bar for each element of the product, WHY that title was chosen, and WHAT concrete criterion each reference is converted into. It carries across sessions and is loaded before any critique, repair, or final quality judgement.",
