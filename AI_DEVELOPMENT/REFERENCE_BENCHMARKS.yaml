 "elements": [
  {
   "id": "E01-COMBAT",
   "name": {
    "ja": "戦闘",
    "en": "Combat"
   },
   "inScope": true,
   "reference": "SK",
   "selection": {
    "elementQuality": "Deflect-and-posture melee where defence is the aggressive act. Fixed, learnable windows; posture as the actual win condition; unblockable attacks that demand a different verb rather than a faster reflex.",
    "reception": "Broadly treated by critics and players as the benchmark implementation of reactive parry combat, and the element of that title most consistently praised.",
    "longevity": "Its combat model has outlived its release window and is now the named point of comparison whenever a new game ships a parry system.",
    "fitToConcept": "KAGEROU already committed to this model in ARCHITECTURE.md §3: posture, maxPosture, a perfect-parry flag and a posture-break stagger window are in the binding entity contract. src/gameplay/Combat.js implements a two-stage window with posture rewards.",
    "applicability": "A timing model costs almost nothing on a phone. It is deterministic, testable, and independent of animation budget — the cheapest high-ceiling combat design available to a procedural build."
   },
   "principles": [
    "The defensive window is fixed, learnable and identical for a given attack — the player improves, the numbers do not move.",
    "Deflecting must out-earn avoiding, or the fight drifts backwards and the design collapses into kiting.",
    "Posture, not health, resolves the fight; health is the punishment for being wrong.",
    "An unblockable attack is answered with a different verb, so knowledge beats reflex.",
    "Impact lands on three channels in the same frame — time (hit-stop), image (shake/FX), sound (transient) — or it reads as weightless."
   ],
   "mustNotCopy": [
    "Reference posture/HP numbers, enemy movesets, boss patterns, the shape or placement of its on-screen warning symbol, or its audio signature for a successful deflect."
   ],
   "criteria": [
    {
     "id": "BM-COMBAT-01",
     "statement": "The perfect-deflect window is a fixed authored duration with a forgiving late window behind it, and the perfect reward strictly exceeds the late one and the cost of failing.",
     "method": "source-audit",
     "apparatus": "exists",
     "threshold": "perfect window ≥ 100 ms; late window present; posture dealt by a perfect deflect ≥ 2× the posture the defender risks on a late one; a guaranteed punish opening ≥ 0.5 s.",
     "measured": "src/gameplay/Combat.js TUNING: PARRY_PERFECT 0.130 s, PARRY_LATE 0.110 s, PARRY_PERFECT_POSTURE 26 vs PARRY_SELF_POSTURE 4.5 (5.8×), PUNISH_WINDOW 0.75 s.",
     "evidenceState": "source-audit",
     "status": "verified"
    },
    {
     "id": "BM-COMBAT-02",
     "statement": "Fights are resolved by posture, not by an HP race.",
     "method": "instrumented-runtime",
     "apparatus": "exists",
     "threshold": "Over ≥ 20 scripted encounters at default tuning, ≥ 60% of enemy deaths follow a posture break rather than health depletion.",
     "measured": "interaction-capture i1: NOT RUN. The scenario and metric exist and are wired, but at the measured 0.2-1.5 simulated frames per second with three enemies engaged (TD-010) the >=20-encounter sample this criterion requires is several hours of wall clock. Deliberately left unmeasured rather than silently redefined to a smaller sample.",
     "evidenceState": "none",
     "status": "proposed"
    },
    {
     "id": "BM-COMBAT-03",
     "statement": "Every enemy attack is legible before it can land, and unblockable attacks are distinguishable from deflectable ones at a glance.",
     "method": "interaction-capture",
     "apparatus": "partial",
     "threshold": "Visible windup ≥ the AI reaction floor the player is implicitly held to (0.140 s, EnemyAI REACTION_FLOOR) for every attack; the unblockable mark is separable from the deflectable colour at thumbnail scale with no colour-vision dependency.",
     "measured": "Colour language exists in source (Combat.js parryable 0xe8f0ff; a 危 unblockable path). The timing half is now measurable and was measured against its sibling BM-ANIM-01, which failed at 17 ms shortest visible windup; the colour-separability half still needs a pixel test this rig does not yet have.",
     "evidenceState": "source-audit",
     "status": "proposed"
    },
    {
     "id": "BM-COMBAT-04",
     "statement": "A successful deflect is felt as heavily as a heavy hit across all three feedback channels within the same frame.",
     "method": "source-audit",
     "apparatus": "exists",
     "threshold": "hit-stop ≥ 60 ms on a perfect deflect; a camera-shake event; an audio transient; all three emitted from the same resolution point.",
     "measured": "HITSTOP_PARRY 0.090 s, SHAKE_PARRY 0.42, and a parry event on ctx.bus consumed by FX and Audio.",
     "evidenceState": "source-audit",
     "status": "verified"
    }
   ],
   "currentGap": "The model is authored correctly and its constants meet the reference-derived thresholds that can be read from source. Nothing about how it PLAYS has ever been verified — no encounter has been driven through the real input surface and measured. BM-COMBAT-02 and -03 are unreachable until an interaction-capture harness exists."
  },
  {
   "id": "E02-MOVEMENT",
   "name": {
    "ja": "移動",
    "en": "Movement and traversal"
   },
   "inScope": true,
   "reference": "GT",
   "selection": {
    "elementQuality": "Grounded, weighted locomotion with immediate directional response and no parkour vocabulary — a swordsman who runs like a person carrying a sword, over natural ground, with foot contact that reads.",
    "reception": "Its traversal feel is consistently cited as one of the reasons the world reads as a place rather than a map.",
    "longevity": "Grounded traversal ages better than trick-based movement; the standard has not moved.",
    "fitToConcept": "KAGEROU's authored speed set (walk 1.9 / run 5.4 / sprint 7.2 m/s, ARCHITECTURE.md §4) and its capsule controller describe exactly this kind of movement. SK's grapple-based mobility is out of concept.",
    "applicability": "Costs no assets: it is capsule dynamics plus procedural foot planting, both of which src/anim/Rig.js already implements."
   },
   "principles": [
    "Momentum is visible but never in charge — acceleration reads as weight, not as ice.",
    "Terrain is traversed, not solved: no ledge puzzles, no traversal minigame.",
    "Feet contact the ground the eye is looking at; sliding contact destroys weight instantly.",
    "The movement vocabulary is small enough to be mastered and never contradicts the fiction."
   ],
   "mustNotCopy": [
    "Reference animation timing, traversal set-pieces, or the specific feel-tuning of a title we cannot measure."
   ],
   "criteria": [
    {
     "id": "BM-MOVE-01",
     "statement": "The authored speed set is the one the controller actually produces, at every tier.",
     "method": "instrumented-runtime",
     "apparatus": "exists",
     "threshold": "Steady-state ground speed within ±5% of 1.9 / 5.4 / 7.2 m/s; independent of frame rate and of dt up to the 0.25 s Engine clamp.",
     "measured": "interaction-capture i1 (move-speeds, phone/MEDIUM, fixed 1/60 s step): ground speed differentiated from WORLD POSITION, not from Player.speed, over a marked 1.5 s window per speed on the gravel arena — 1.900 / 5.400 / 7.200 m/s against authored 1.9 / 5.4 / 7.2, all inside ±5%, 70 samples each. Frame-rate independence is implied by the fixed timestep but was not separately swept.",
     "evidenceState": "runtime-measured",
     "status": "verified"
    },
    {
     "id": "BM-MOVE-02",
     "statement": "No foot sliding at any locomotion speed.",
     "method": "interaction-capture",
     "apparatus": "exists",
     "threshold": "Planted-foot world-space drift ≤ 2 cm per frame while the foot is in contact, at all three speeds and on ≥ 15° slopes.",
     "measured": "interaction-capture i1 (foot-plant): FAIL. Planted-foot world drift p95 25.9 cm/frame, worst 29.9 cm/frame, against a 2 cm bar; 181 contact samples over walk/run/sprint. Contact is self-calibrated as within 2 cm of each foot's own low point AND vertically still (<4 mm/frame), because the foot bone and the ground ray are separated by a fixed ~0.43 m offset. Slopes were not covered: the run is on flat arena gravel.",
     "evidenceState": "runtime-measured",
     "status": "blocked"
    },
    {
     "id": "BM-MOVE-03",
     "statement": "Direction changes are immediate and weighted, with no unresponsive turn-in-place window that the player can feel as lag.",
     "method": "interaction-capture",
     "apparatus": "exists",
     "threshold": "A 180° stick reversal at run speed produces a heading change within 250 ms and never a state where input is ignored for > 100 ms.",
     "measured": "interaction-capture i1 (move-reversal): FAIL on the turn half, PASS on the responsiveness half. Eight 180° stick reversals at run speed each completed in 283 ms against a 250 ms bar; response latency was 17 ms (one frame) against a 100 ms bar, so no input is being eaten — the turn is simply 33 ms slower than the criterion allows.",
     "evidenceState": "runtime-measured",
     "status": "blocked"
    }
   ],
   "currentGap": "Entirely unverified at runtime. The constants exist in src/world/Constants.js and ARCHITECTURE.md §4; whether the controller honours them, and whether feet slide, has never been measured."
