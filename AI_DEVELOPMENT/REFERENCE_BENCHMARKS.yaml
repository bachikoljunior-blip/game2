   "For each affected element, re-check whether its reference still fits the changed concept. Change the reference ONLY if it no longer fits — not because a different title is newly interesting.",
   "If a reference must change, the replacement must be at least as strong on the same five selection axes (element quality, expert and player reception, long-term reputation, fit to concept, applicability to this device and production scale). Record the reason.",
   "Re-derive the affected criteria. A criterion may become stricter freely; it may only be weakened under the rule below.",
   "Run npm run validate:project and update PROJECT_STATE.yaml and SESSION_STATE.yaml."
  ],
  "criterionWeakeningRule": {
   "statement": "A criterion may NEVER be weakened to let the current implementation pass.",
