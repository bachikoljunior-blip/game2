   "id": "E04-EXPLORATION",
   "name": {
    "ja": "探索",
    "en": "Exploration and navigation"
   },
   "inScope": true,
   "reference": "GT",
   "selection": {
    "elementQuality": "Diegetic navigation: the world and its weather guide the player instead of an icon field, and looking around is rewarded rather than replaced by a map.",
    "reception": "The single most-cited design idea from the title, and the one most often adopted by later games.",
    "longevity": "It changed the default expectation for guidance in third-person games and still reads as the better answer.",
    "fitToConcept": "KAGEROU has a 220 m playable region, a wind field that already drives every visual system (WeatherSystem), and objective lines rather than a map. The principle scales down to a vertical slice without modification.",
    "applicability": "Free: it is a subtraction. It removes UI rather than adding systems, which suits a phone screen and a zero-asset build."
   },
   "principles": [
    "Landmarks navigate, not icons. Silhouette hierarchy is the map.",
    "Guidance is diegetic and optional; the player is never reading instructions instead of looking at the world.",
    "Curiosity is rewarded — a player who walks toward something odd finds something authored.",
    "No minimap, no icon field, no collectible counter (anti-reference AR-03)."
   ],
   "mustNotCopy": [
    "A directional guidance mechanic presented the way the reference presents it. If KAGEROU uses its wind at all for guidance, the expression must be its own and must not read as a quotation."
   ],
   "criteria": [
    {
     "id": "BM-EXPLORE-01",
     "statement": "The shrine is navigable by landmark alone.",
     "method": "interaction-capture",
     "apparatus": "exists",
     "threshold": "From every spawn and approach point, at least one navigational landmark (great torii, honden roof, bell tower) is visible in silhouette; a first-time route to the honden requires no HUD navigation aid.",
     "measured": "interaction-capture i1 (landmark-survey): FAIL, narrowly. From 8 approach points at 1.62 m eye height, 7 see at least one of the four landmark anchors unoccluded and inside the frustum; 'east-edge' (22, 34) sees none. Visibility here is frustum containment plus an unoccluded ray to the anchor — it does not judge whether the silhouette reads.",
     "evidenceState": "runtime-measured",
     "status": "blocked"
    },
    {
     "id": "BM-EXPLORE-02",
     "statement": "Off-path curiosity is rewarded with authored content, not emptiness.",
     "method": "source-audit",
