  {
   "id": "E03-CAMERA",
   "name": {
    "ja": "カメラ",
    "en": "Camera"
   },
   "inScope": true,
   "reference": "GT",
   "antiReference": "AR-01",
   "selection": {
    "elementQuality": "A third-person camera that composes rather than merely follows: framing that keeps a photograph at every moment, controlled distance and FOV response, and lock-on that keeps both bodies readable.",
    "reception": "Its framing quality is the most frequently praised aspect of the title after its art direction.",
    "longevity": "Composition-first third-person camera work remains the standard; nothing has displaced it.",
    "fitToConcept": "src/gameplay/PlayerCamera.js already states this intent in its own header — 'lock-on that composes a genuine two-shot'. KAGEROU's entire review loop is composition-driven, so a camera benchmarked on framing is coherent with how the project already judges itself.",
    "applicability": "Pure maths: boom length, damping, sphere-cast collision, event-driven FOV. No asset or budget cost."
   },
   "principles": [
    "Every frame should survive being paused and looked at.",
    "Lock-on frames the relationship, not just the target — both bodies readable, the space between them legible.",
    "The camera never fights the player and never occupies geometry.",
    "FOV and distance changes are event-driven and bounded; a constantly breathing camera is nausea, not energy."
   ],
   "mustNotCopy": [
    "Reference shot choreography, cinematic camera moves, or photo-mode framing presets."
   ],
   "criteria": [
    {
     "id": "BM-CAMERA-01",
     "statement": "Under lock-on, both the player and the locked target remain resolvable in frame, including against walls and in the shrine's tightest space.",
     "method": "interaction-capture",
     "apparatus": "exists",
     "threshold": "Both bodies inside the central 80% of the frame for ≥ 95% of a lock-on encounter; the target never fully leaves frame; explicitly tested backed into a corner and against the tallest enemy archetype (this is anti-reference AR-01).",
     "measured": "interaction-capture i1 (lockon-framing): NOT MEASURED. Lock-on never engaged for a single frame of 840 with three living enemies at 3-5 m and a lock-on press every two seconds, so no locked frame existed to judge framing on. Whether the scenario or the lock-on acquisition is at fault is undetermined — PlayerCamera._cycleLock releases when every candidate scores Infinity, which its occlusion test can produce. Diagnose before re-running.",
     "evidenceState": "none",
     "status": "proposed"
    },
    {
     "id": "BM-CAMERA-02",
     "statement": "The camera never renders from inside geometry.",
     "method": "instrumented-runtime",
     "apparatus": "exists",
     "threshold": "Zero frames over a scripted traversal of the playable region where the near plane is inside a collider; the sphere-cast pull-in never produces a discontinuous jump > 1.5 m in one frame.",
     "measured": "interaction-capture i1 (camera-traverse, 1,896 frames over a ten-leg circuit of the plateau): FAIL. 36 frames placed a solid collider within one near-plane radius of the eye. The pull-in half PASSES: worst single-frame eye displacement 0.599 m against a 1.5 m bar, with 9 frames around the scripted teleport excluded. 'Inside geometry' is a conservative proxy, not a containment test.",
     "evidenceState": "runtime-measured",
     "status": "blocked"
    },
    {
     "id": "BM-CAMERA-03",
     "statement": "FOV and boom responses are bounded and event-driven.",
     "method": "source-audit",
     "apparatus": "exists",
     "threshold": "Base FOV fixed; total event-driven excursion ≤ 10°; every excursion tied to a named gameplay event rather than a continuous oscillator.",
     "measured": "Base FOV 58°, sprint push +6°, heavy-connect pull-in, damped at 5.0. Within the bound.",
     "evidenceState": "source-audit",
     "status": "verified"
    },
    {
     "id": "BM-CAMERA-04",
     "statement": "Camera shake never costs legibility during a defensive window.",
     "method": "interaction-capture",
     "apparatus": "partial",
     "threshold": "During any 130 ms perfect-deflect window the target's on-screen centroid moves ≤ 4% of frame width from shake alone.",
     "measured": "interaction-capture i1: NOT MEASURED. The shake ablation pair (shakeScale 1 vs 0) diverged by 22.55 m in player position, so the difference between the runs is not attributable to shake. Cause identified: the harness bot steers relative to PlayerCamera.yaw, so camera shake feeds back into its input and breaks the lockstep the ablation depends on. The ablation needs a shake-independent stimulus.",
     "evidenceState": "none",
     "status": "proposed"
    }
   ],
   "currentGap": "Only the FOV bound is verified, and only as an authored value. The composition and lock-on claims in the source header have never been tested — and the five-shot review set uses fixed cinematic framings, so it cannot test them even in principle."
  },
