 "concept": {
  "statement": "KAGEROU 陽炎 — a mobile-first, third-person Japanese sword-action game in Three.js, set at a mountain shrine above a bamboo sea at magic hour, built to the standard of a shipped AAA console title, with every texture, mesh, animation and sound synthesised locally at boot and zero external runtime assets.",
  "lastConfirmed": "2026-08-01",
  "source": "CLAUDE.md 'The goal, unchanged'; ARCHITECTURE.md §0/§5/§6/§7; AI_DEVELOPMENT/REQUIREMENTS.md. No part of the concept was changed by the instruction that created this file.",
  "invariants": [
   "Third-person melee swordplay is the core verb. The game is not a shooter, not a soulslike stat-treadmill, and not an open-world checklist.",
   "Phone is the primary platform and the pass/fail line; desktop is supported, never prioritised.",
   "Zero external runtime assets. No downloaded meshes, textures, audio, fonts, or recorded voice — which permanently removes voice acting, licensed music, and photo-scanned material from every solution space below.",
   "No external AI API, hosted agent, or paid inference in the shipped product.",
   "Scope is one authored vertical slice: a 220 m fenced playable region (WORLD.PLAYABLE), four scripted encounters, one shrine plateau. Not an open world.",
   "Quality is judged by a separate hostile critic against evidence, never by the agent that wrote the code."
  ],
  "outOfConcept": [
   "Branching narrative, dialogue trees, morality systems, romance, faction reputation.",
   "Loot, crafting, gear progression, levelling curves, live-service economy.",
   "Multiplayer, online services, accounts, telemetry upload.",
   "Stealth as a primary pillar, ranged weapons as a primary pillar, mount/traversal-vehicle systems."
  ]
 },
 "evidenceBasis": {
  "declaration": "HONEST STATEMENT OF WHAT THIS FILE IS AND IS NOT. The reference titles below are characterised from general knowledge of their published gameplay and critical reception. Within this repository and container NO reference footage was fetched, NO reference title was played or measured, NO blind side-by-side against a real reference frame has been performed, and NO expert or player review of KAGEROU has been solicited. Outbound network access is proxy-restricted in this environment and even the project's own GitHub Pages surface was denied at the last attempt (PROJECT_STATE.verifiedState.publication.browserGate).",
  "consequence": "Every criterion below is therefore written so it can be checked against KAGEROU'S OWN build with tools this repository has or can build — a measurable property of our frames, our source, our runtime, or our device — never as 'compare to the reference image'. Reference titles supply the PRINCIPLE and the STANDARD; the threshold is always measured on us.",
  "prohibitedClaims": [
   "Do not record a blind comparison against a reference title as performed. The critic's recalled-framing comparison in tools/CRITIC.md is a judgement from memory and must be labelled as such.",
   "Do not record real-device performance as measured. SwiftShader capture evidence is not phone evidence.",
   "Do not record expert or player validation. None has occurred.",
   "Do not describe a reference title's internal implementation as fact. Only its observable, published behaviour is usable."
  ]
 },
